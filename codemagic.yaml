workflows:
  ios-simulator-f9:
    name: INVEN3 iOS Simulator F9
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - inven3_qa
      node: 24
      xcode: 26.4
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Typecheck
        script: npm run typecheck

      - name: Verify INVEN3-QA build environment
        script: |
          set -e
          test -n "$VITE_SUPABASE_URL" || { echo "[FAIL] VITE_SUPABASE_URL missing"; exit 21; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "[FAIL] VITE_SUPABASE_ANON_KEY missing"; exit 22; }
          case "$VITE_SUPABASE_URL" in
            *uazunvlxlszdyweddxtb.supabase.co*) ;;
            *) echo "[FAIL] Refusing non-QA Supabase URL"; exit 23 ;;
          esac
          echo "VITE_APP_VERSION=f9b-ios-qa-${CM_COMMIT:0:8}" >> "$CM_ENV"
          echo "[PASS] INVEN3-QA build environment present"

      - name: Build web bundle
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          pod install
          test -f "Pods/Target Support Files/Pods-App/Pods-App.debug.xcconfig"
          test -d "App.xcworkspace"
          echo "[PASS] CocoaPods workspace/config generated"

      - name: Verify CocoaPods Debug integration
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings \
            CODE_SIGNING_ALLOWED=NO \
            > "$CM_BUILD_DIR/ios-build-settings.log"
          grep -E "PODS_ROOT|FRAMEWORK_SEARCH_PATHS|OTHER_LDFLAGS|CAPACITOR_DEBUG" "$CM_BUILD_DIR/ios-build-settings.log" | head -80 || true

      - name: Build unsigned iOS simulator app
        script: |
          set +e
          set -o pipefail
          xcodebuild build \
            -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/ios-simulator-build.log"
          status=${PIPESTATUS[0]}
          grep -nE "error:|fatal error:|Undefined symbols|ld: |BUILD FAILED|The following build commands failed" \
            "$CM_BUILD_DIR/ios-simulator-build.log" \
            > "$CM_BUILD_DIR/ios-simulator-errors.log" || true
          echo "----- iOS concise diagnostics -----"
          cat "$CM_BUILD_DIR/ios-simulator-errors.log" || true
          exit $status

    artifacts:
      - ios-simulator-build.log
      - ios-simulator-errors.log
      - ios-build-settings.log
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM


  ios-device-package-f9:
    name: INVEN3 iOS Real Device Package F9
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - inven3_qa
      node: 24
      xcode: 26.4
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Typecheck
        script: npm run typecheck

      - name: Verify INVEN3-QA build environment
        script: |
          set -e
          test -n "$VITE_SUPABASE_URL" || { echo "[FAIL] VITE_SUPABASE_URL missing"; exit 21; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "[FAIL] VITE_SUPABASE_ANON_KEY missing"; exit 22; }
          case "$VITE_SUPABASE_URL" in
            *uazunvlxlszdyweddxtb.supabase.co*) ;;
            *) echo "[FAIL] Refusing non-QA Supabase URL"; exit 23 ;;
          esac
          echo "VITE_APP_VERSION=f9b-ios-qa-${CM_COMMIT:0:8}" >> "$CM_ENV"
          echo "[PASS] INVEN3-QA build environment present"

      - name: Build web bundle
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          pod install
          test -f "Pods/Target Support Files/Pods-App/Pods-App.debug.xcconfig"
          test -d "App.xcworkspace"
          echo "[PASS] CocoaPods workspace/config generated"

      - name: Verify iPhoneOS build settings
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          xcodebuild             -workspace App.xcworkspace             -scheme "$XCODE_SCHEME"             -configuration Debug             -sdk iphoneos             -showBuildSettings             CODE_SIGNING_ALLOWED=NO             > "$CM_BUILD_DIR/ios-device-build-settings.log"
          grep -E "SDKROOT|SUPPORTED_PLATFORMS|ARCHS|PODS_ROOT|FRAMEWORK_SEARCH_PATHS|OTHER_LDFLAGS|PRODUCT_BUNDLE_IDENTIFIER"             "$CM_BUILD_DIR/ios-device-build-settings.log" | head -120 || true

      - name: Build unsigned iPhoneOS app
        script: |
          set +e
          set -o pipefail
          rm -rf "$CM_BUILD_DIR/build-ios-device"
          xcodebuild build             -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE"             -scheme "$XCODE_SCHEME"             -configuration Debug             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$CM_BUILD_DIR/build-ios-device"             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             2>&1 | tee "$CM_BUILD_DIR/ios-device-build.log"
          status=${PIPESTATUS[0]}
          grep -nE "error:|fatal error:|Undefined symbols|ld: |BUILD FAILED|The following build commands failed"             "$CM_BUILD_DIR/ios-device-build.log"             > "$CM_BUILD_DIR/ios-device-errors.log" || true
          echo "----- iPhoneOS concise diagnostics -----"
          cat "$CM_BUILD_DIR/ios-device-errors.log" || true
          exit $status

      - name: Package unsigned device IPA for cloud re-signing
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/build-ios-device/Build/Products" -type d -name "App.app" -path "*iphoneos*" | head -1)
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          rm -rf "$CM_BUILD_DIR/device-package"
          mkdir -p "$CM_BUILD_DIR/device-package/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/device-package/Payload/App.app"
          cd "$CM_BUILD_DIR/device-package"
          /usr/bin/zip -qry "$CM_BUILD_DIR/INVEN3-F9-unsigned-device.ipa" Payload
          /usr/bin/shasum -a 256 "$CM_BUILD_DIR/INVEN3-F9-unsigned-device.ipa" | tee "$CM_BUILD_DIR/INVEN3-F9-unsigned-device.sha256"
          /usr/bin/unzip -l "$CM_BUILD_DIR/INVEN3-F9-unsigned-device.ipa" | head -40
          echo "[PASS] Device-target IPA packaged for BrowserStack/App Live re-signing"

    artifacts:
      - INVEN3-F9-unsigned-device.ipa
      - INVEN3-F9-unsigned-device.sha256
      - ios-device-build.log
      - ios-device-errors.log
      - ios-device-build-settings.log
      - /tmp/xcodebuild_logs/*.log
      - build-ios-device/Build/Products/**/*.app
      - build-ios-device/Build/Products/**/*.dSYM


  ios-release-candidate-f10a:
    name: INVEN3 iOS Release Candidate F10A
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - inven3_qa
      node: 24
      xcode: 26.4
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        VITE_RELEASE_ENV: "qa"
        VITE_RELEASE_CHANNEL: "beta"
        VITE_RELEASE_VERSION: "1.0.0"
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Stamp QA/BETA candidate identity
        script: |
          set -e
          NATIVE_BUILD=$((10000 + BUILD_NUMBER))
          echo "VITE_APP_BUILD=${CM_COMMIT:0:8}.${BUILD_NUMBER}" >> "$CM_ENV"
          echo "INVEN3_NATIVE_BUILD_NUMBER=$NATIVE_BUILD" >> "$CM_ENV"
          echo "[PASS] candidate build ${CM_COMMIT:0:8}.${BUILD_NUMBER}; native build $NATIVE_BUILD"

      - name: Fail-closed release preflight
        script: npm run release:preflight

      - name: Typecheck
        script: npm run typecheck

      - name: Unit tests
        script: npm run test

      - name: Build QA/BETA web bundle
        script: npm run build

      - name: Audit built QA/BETA bundle
        script: npm run release:audit-bundle

      - name: Generate release manifest
        script: npm run release:manifest

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          pod install
          test -d "App.xcworkspace"

      - name: Build unsigned iPhoneOS release candidate
        script: |
          set +e
          set -o pipefail
          rm -rf "$CM_BUILD_DIR/build-ios-f10a"
          xcodebuild build \
            -workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build-ios-f10a" \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="$INVEN3_NATIVE_BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/ios-f10a-release-build.log"
          status=${PIPESTATUS[0]}
          grep -nE "error:|fatal error:|Undefined symbols|ld: |BUILD FAILED|The following build commands failed" \
            "$CM_BUILD_DIR/ios-f10a-release-build.log" \
            > "$CM_BUILD_DIR/ios-f10a-release-errors.log" || true
          exit $status

      - name: Verify iOS native version
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/build-ios-f10a/Build/Products" -type d -name "App.app" -path "*iphoneos*" | head -1)
          test -n "$APP_PATH"
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          test "$SHORT_VERSION" = "1.0.0"
          test "$BUILD_VERSION" = "$INVEN3_NATIVE_BUILD_NUMBER"
          echo "[PASS] iOS package identity version=$SHORT_VERSION build=$BUILD_VERSION"

      - name: Package unsigned QA/BETA IPA
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/build-ios-f10a/Build/Products" -type d -name "App.app" -path "*iphoneos*" | head -1)
          test -n "$APP_PATH"
          rm -rf "$CM_BUILD_DIR/f10a-device-package"
          mkdir -p "$CM_BUILD_DIR/f10a-device-package/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/f10a-device-package/Payload/App.app"
          cd "$CM_BUILD_DIR/f10a-device-package"
          OUT="$CM_BUILD_DIR/INVEN3-1.0.0-beta-${BUILD_NUMBER}-unsigned.ipa"
          /usr/bin/zip -qry "$OUT" Payload
          /usr/bin/shasum -a 256 "$OUT" | tee "$CM_BUILD_DIR/INVEN3-1.0.0-beta-${BUILD_NUMBER}.sha256"
          echo "[PASS] unsigned QA/BETA IPA packaged; no production signing or promotion performed"

      - name: Verify iOS release candidate evidence
        script: |
          set -e
          IPA="$CM_BUILD_DIR/INVEN3-1.0.0-beta-${BUILD_NUMBER}-unsigned.ipa"
          cd "$CM_BUILD_DIR"
          npm run release:verify-candidate -- \
            --platform ios \
            --artifact "$IPA" \
            --out artifacts/release/INVEN3-ios-candidate-evidence.json

    artifacts:
      - INVEN3-1.0.0-beta-*-unsigned.ipa
      - INVEN3-1.0.0-beta-*.sha256
      - ios-f10a-release-build.log
      - ios-f10a-release-errors.log
      - artifacts/release/INVEN3-release-manifest.json
      - artifacts/release/INVEN3-ios-candidate-evidence.json
      - build-ios-f10a/Build/Products/**/*.app
      - build-ios-f10a/Build/Products/**/*.dSYM
