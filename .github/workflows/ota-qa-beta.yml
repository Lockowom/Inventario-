name: OTA QA Beta

on:
  push:
    branches: [qa]
  workflow_dispatch:
    inputs:
      ota_version:
        description: Immutable canonical app version, equal to version.json appVersion
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-immutable-qa-bundle:
    # No PR, production or arbitrary feature branch can publish OTA.
    if: github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    environment: qa
    env:
      VITE_RELEASE_ENV: qa
      VITE_RELEASE_CHANNEL: beta
      VITE_SUPABASE_URL: https://kpsdephjbvkwvazxubtb.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.INVEN3_QA_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Load canonical INVEN3 version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p 'require("./version.json").appVersion')"
          NATIVE_VERSION="$(node -p 'require("./version.json").nativeVersion')"
          VERSION_CODE="$(node -p 'require("./version.json").versionCode')"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]{2}\.[0-9]{2}$ ]]
          [[ "$NATIVE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]{2}\.[0-9]{2}$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          echo "VITE_RELEASE_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "VITE_NATIVE_VERSION=$NATIVE_VERSION" >> "$GITHUB_ENV"
          echo "INVEN3_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate immutable QA-only OTA version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.ota_version }}"
          if [[ -z "$VERSION" ]]; then VERSION="${VITE_RELEASE_VERSION}"; fi
          [[ "$VERSION" == "$VITE_RELEASE_VERSION" ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]{2}\.[0-9]{2}$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:qa
      - name: Build reproducible web bundle
        id: bundle
        shell: bash
        run: |
          find dist -exec touch -h -t 198001010000 {} +
          (cd dist && find . -type f -print | LC_ALL=C sort | zip -X -q ../inven3-ota-${{ steps.version.outputs.version }}.zip -@)
          echo "sha256=$(sha256sum inven3-ota-${{ steps.version.outputs.version }}.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s inven3-ota-${{ steps.version.outputs.version }}.zip)" >> "$GITHUB_OUTPUT"
      - name: Write immutable OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          cat > "inven3-ota-${{ steps.version.outputs.version }}.manifest.json" <<EOF
          {"product":"INVEN3","appVersion":"${{ steps.version.outputs.version }}","channel":"qa-beta","minimumNativeVersion":"${VITE_NATIVE_VERSION}","minimumVersionCode":${INVEN3_VERSION_CODE},"sha256":"${{ steps.bundle.outputs.sha256 }}","sizeBytes":${{ steps.bundle.outputs.size}},"createdAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","commitSha":"$GITHUB_SHA","entrypoint":"index.html"}
          EOF
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ota-${{ steps.version.outputs.version }}" "inven3-ota-${{ steps.version.outputs.version }}.zip" "inven3-ota-${{ steps.version.outputs.version }}.manifest.json" \
            --target "$GITHUB_SHA" --title "INVEN3 QA OTA ${{ steps.version.outputs.version }}" --notes "Android QA web bundle. Immutable SHA-256: ${{ steps.bundle.outputs.sha256 }}"
      - name: Register immutable bundle in INVEN3 QA
        env:
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
          OTA_PUBLISH_URL: ${{ secrets.OTA_PUBLISH_URL }}
        run: |
          test -n "$OTA_PUBLISH_TOKEN" && test -n "$OTA_PUBLISH_URL"
          curl --fail-with-body --silent --show-error --request POST "$OTA_PUBLISH_URL" \
            --header 'content-type: application/json' \
            --header "x-ota-publish-token: $OTA_PUBLISH_TOKEN" \
            --data "{\"version\":\"${{ steps.version.outputs.version }}\",\"minNativeVersion\":\"${VITE_NATIVE_VERSION}\",\"minVersionCode\":${INVEN3_VERSION_CODE},\"entrypoint\":\"index.html\",\"url\":\"https://github.com/${{ github.repository }}/releases/download/ota-${{ steps.version.outputs.version }}/inven3-ota-${{ steps.version.outputs.version }}.zip\",\"sha256\":\"${{ steps.bundle.outputs.sha256 }}\",\"sizeBytes\":${{ steps.bundle.outputs.size }},\"commitSha\":\"$GITHUB_SHA\"}"
