name: F10A Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_RELEASE_ENV: qa
  VITE_RELEASE_CHANNEL: beta
  VITE_RELEASE_VERSION: 1.0.0
  VITE_SUPABASE_URL: https://uazunvlxlszdyweddxtb.supabase.co

jobs:
  android-release-candidate:
    name: Android QA/BETA release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_ANON_KEY: ${{ secrets.INVEN3_QA_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Stamp candidate identity
        shell: bash
        run: |
          NATIVE_BUILD=$((10000 + GITHUB_RUN_NUMBER))
          echo "VITE_APP_BUILD=${GITHUB_SHA::8}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "INVEN3_NATIVE_BUILD_NUMBER=$NATIVE_BUILD" >> "$GITHUB_ENV"

      - name: Fail-closed release preflight
        run: npm run release:preflight

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build QA/BETA web bundle
        run: npm run build

      - name: Audit built QA/BETA bundle
        run: npm run release:audit-bundle

      - name: Generate release manifest
        run: npm run release:manifest

      - name: Sync Android
        run: npx cap sync android

      - name: Build unsigned Android release artifacts
        working-directory: android
        shell: bash
        run: |
          ./gradlew assembleRelease bundleRelease             -PINVEN3_VERSION_CODE="$INVEN3_NATIVE_BUILD_NUMBER"             -PINVEN3_VERSION_NAME="1.0.0"             --no-daemon

      - name: Create installable QA lab APK
        shell: bash
        run: |
          set -e
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -type f -name '*-unsigned.apk' -print -quit)"
          test -n "$UNSIGNED_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -print | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          LAB_KEYSTORE="$RUNNER_TEMP/inven3-f10a-lab.jks"
          keytool -genkeypair \
            -keystore "$LAB_KEYSTORE" \
            -storepass changeit \
            -keypass changeit \
            -alias inven3-f10a-lab \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=INVEN3 F10A QA Lab,O=INVEN3,C=CL" \
            -noprompt
          ALIGNED_APK="$RUNNER_TEMP/inven3-f10a-aligned.apk"
          LAB_APK="artifacts/release/INVEN3-1.0.0-beta-${GITHUB_RUN_NUMBER}-lab.apk"
          "$ZIPALIGN" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK" >/dev/null
          "$APKSIGNER" sign \
            --ks "$LAB_KEYSTORE" \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias inven3-f10a-lab \
            --out "$LAB_APK" \
            "$ALIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$LAB_APK" | tee artifacts/release/android-lab-signature.txt
          rm -f "$LAB_KEYSTORE" "$ALIGNED_APK"
          echo "[PASS] Ephemeral QA lab APK signed; key destroyed; not valid as production signing identity"

      - name: Verify Android native version
        shell: bash
        run: |
          set -e
          APK="$(find artifacts/release -type f -name 'INVEN3-1.0.0-beta-*-lab.apk' -print -quit)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | head -1 | tee artifacts/release/android-package-badging.txt
          grep -q "versionCode='$INVEN3_NATIVE_BUILD_NUMBER'" artifacts/release/android-package-badging.txt
          grep -q "versionName='1.0.0'" artifacts/release/android-package-badging.txt
          echo "[PASS] Android package identity versionCode=$INVEN3_NATIVE_BUILD_NUMBER versionName=1.0.0"

      - name: Hash Android artifacts
        shell: bash
        run: |
          {
            find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print0
            find artifacts/release -type f -name 'INVEN3-1.0.0-beta-*-lab.apk' -print0
          } | sort -z | xargs -0 sha256sum | tee artifacts/release/android-sha256.txt

      - name: Verify Android release candidate evidence
        shell: bash
        run: |
          set -e
          APK="$(find artifacts/release -type f -name 'INVEN3-1.0.0-beta-*-lab.apk' -print -quit)"
          AAB="$(find android/app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          npm run release:verify-candidate -- \
            --platform android \
            --artifact "$APK" \
            --artifact "$AAB" \
            --out artifacts/release/INVEN3-android-candidate-evidence.json

      - name: Upload QA/BETA candidate
        uses: actions/upload-artifact@v4
        with:
          name: inven3-1.0.0-beta-android
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            artifacts/release/INVEN3-1.0.0-beta-*-lab.apk
            artifacts/release/android-lab-signature.txt
            artifacts/release/INVEN3-release-manifest.json
            artifacts/release/INVEN3-android-candidate-evidence.json
            artifacts/release/android-package-badging.txt
            artifacts/release/android-sha256.txt
