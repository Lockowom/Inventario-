name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'release/**']

permissions:
  contents: read

jobs:
  app-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start -x storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx supabase db reset
      - run: npx supabase test db --local supabase/tests
      - run: eval "$(npx supabase status -o env)" && node scripts/supabase-sync-integration.mjs
      - run: npx supabase db advisors --local --type security --level warn --fail-on error
